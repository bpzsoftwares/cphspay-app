name: Build APK CphsPay

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Java 17 (necessário para Android build)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Instalar dependências npm
      - name: Install dependencies
        run: npm ci

      # 6. Build do React (produção)
      - name: Build React app
        run: npm run build
        env:
          VITE_API_URL: http://mc.elylphosting.com.br:25597/api

      # 7. Capacitor sync
      - name: Capacitor sync Android
        run: npx cap sync android

      # 8. Permissão no gradlew
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 9. Build APK debug (sem precisar de keystore)
      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 10. Fazer upload do APK como artefato
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CphsPay-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 11. (Opcional) Build APK release com assinatura
      # Para gerar APK release assinado, adicione estes secrets no GitHub:
      # KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
      - name: Build APK (release) — se tiver keystore configurado
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Upload APK Release
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: CphsPay-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
